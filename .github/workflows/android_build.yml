name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - name: Audit Android compatibility patches
        shell: bash
        run: |
          grep -Fx 'kotlin.incremental=false' android/gradle.properties
          grep -Fx '    compileSdkVersion 36' rust_builder/android/build.gradle
          grep -Fq 'import org.gradle.process.ExecOperations' rust_builder/cargokit/gradle/plugin.gradle
          grep -Fq 'abstract ExecOperations getExecOperations()' rust_builder/cargokit/gradle/plugin.gradle
          grep -Fq 'execOperations.exec {' rust_builder/cargokit/gradle/plugin.gradle
      - name: Restore dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
