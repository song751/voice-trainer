[package]
name = "rust_lib_voice_trainer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Used only while FRB parses `crate::api`. It makes DSP implementation modules
# crate-private so code generation cannot accidentally discover them as bridge
# surface. Runtime builds and Rust integration tests use the default API.
frb = []

[dependencies]
rustfft = "=6.4.1"
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
symphonia = { version = "=0.5.5", features = ["all-codecs", "all-formats"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Native keeps FRB's normal worker pool so Rust work stays off the Flutter UI
# isolate.
flutter_rust_bridge = "=2.12.0"
tract-onnx = "=0.23.5"

[target.'cfg(target_family = "wasm")'.dependencies]
# Phase 0's Web baseline is deliberately single-threaded. FRB 2.12 enables its
# WASM WorkerPool through the default `thread-pool` feature; that pool requires
# shared WebAssembly memory. Keep the remaining defaults explicitly, without
# forcing SharedArrayBuffer/COOP/COEP on the baseline build.
flutter_rust_bridge = { version = "=2.12.0", default-features = false, features = [
    "anyhow",
    "dart-opaque",
    "log",
    "portable-atomic",
    "rust-async",
    "user-utils",
    "wasm-start",
] }
# These exports are used only by the explicit browser Worker wrapper.  They do
# not enable FRB's incompatible 2.12 WASM WorkerPool.
serde-wasm-bindgen = "=0.6.5"
wasm-bindgen = "=0.2.114"

[dev-dependencies]
serde_json = "=1.0.149"

[[bench]]
name = "realtime_pipeline"
harness = false

[[bench]]
name = "bridge_payload"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
